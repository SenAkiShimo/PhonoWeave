[project]
name = "phonoweave"
version = "0.0.1"
description = "Speaker-adaptive phonetic realization analysis and recording-scheme generation"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
]

[project.scripts]
phonoweave = "phonoweave.entrypoint:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["phonoweave*"]
